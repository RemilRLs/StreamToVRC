services:
  rtmp-hls:
    image: alfg/nginx-rtmp@sha256:780831ae1c4116d22a287ce43f9e1befb84ccaad0b6933de041bb29b6427b513
    restart: unless-stopped
    ports:
      - "${RTMP_BIND_ADDRESS:-127.0.0.1}:1935:1935"
      - "${HLS_BIND_ADDRESS:-0.0.0.0}:8080:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/profiles/${STREAM_PROFILE:-full}:/etc/nginx/profile:ro
      - hls:/opt/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reverse-proxy:
    profiles: [https]
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      STREAM_DOMAIN: ${STREAM_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: ^STREAM_DOMAIN$
    volumes:
      - ./reverse-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./reverse-proxy/certificates:/etc/nginx/certificates:ro
    depends_on:
      rtmp-hls:
        condition: service_healthy

volumes:
  hls:
